[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "tests"
via_ir = true
optimizer = true
optimizer-runs = 150
evm_version = "paris"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

remappings = [
    "solmate/=lib/solmate/src/",
    '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
    "solady/=lib/solady/src/",
    "@chainlink-ccip/=lib/ccip/contracts/src/v0.8/ccip/",
    "@chainlink-shared/=lib/ccip/contracts/src/v0.8/shared/",
    "@bloom-v2/=lib/bloom-v2/src/",
    "@StakeUp/=src/"
]

fs_permissions = [{ access = "read", path = "./lib/bloom-v2/out/BloomPool.sol/BloomPool.json"}]

gas_reports = ["*"]
gas_reports_ignore = [
    "MockERC20",
    "MockCurveFactory",
    "MockCurveGauge",
    "MockEndpoint",
    "MockDripRewarder",
    "MockERC20",
    "MockPriceFeed", 
    "StUsdcSetup"
]

[fuzz]
runs = 10000

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
base = "${BASE_RPC_URL}"
arbitrum_sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}"}
base_sepolia = { key = "${BASESCAN_API_KEY}"}
